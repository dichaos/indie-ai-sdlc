# Generic Semgrep rules (customize `languages:` and route prefixes to match your project)
rules:
  - id: unauthenticated-state-mutation-route
    languages: [generic]
    severity: ERROR
    message: >-
      Security Violation: State-mutating API routes (POST/PUT/DELETE under /api/) MUST enforce
      explicit authentication and authorization scope checks before executing commands.
    patterns:
      - pattern-regex: "(?i)(POST|PUT|DELETE)[^\\n]*/api/(admin|control|billing)/"
      - pattern-not-regex: "(?i)(Authorize|RequireScope|require_auth|require_scope)"

  - id: no-float-precision-critical-values
    languages: [generic]
    severity: WARNING
    message: >-
      Domain Rule (#ai-pin): Represent monetary, billing, or cumulative measurement quantities
      using exact integer or decimal types, never floating-point types, to prevent rounding drift.
    pattern-regex: "(?i)\\b(float|double|float32|float64)\\s+[a-z0-9_]*(amount|price|balance|billing|tariff|total_cents)[a-z0-9_]*"
